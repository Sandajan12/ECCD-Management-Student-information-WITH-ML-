name: Parent sync and Excel import regressions

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ames_ci
          POSTGRES_USER: ames_ci
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ames_ci -d ames_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      ENVIRONMENT: development
      ENABLE_OTP: 'false'
      DATABASE_URL: postgresql://ames_ci:disposable-ci-password@127.0.0.1:5432/ames_ci
      JWT_SECRET: ci-only-jwt-key-for-disposable-integration-tests
      BACKUP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      BACKUP_IV: unused-ci-fixture
      LRN_ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      LRN_HMAC_SECRET: ci-only-lrn-hmac-for-disposable-integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv venv --python 3.12 .venv312
      - run: uv pip install --python .venv312 -r backend/requirements.txt
      - name: Run focused integration regressions in disposable schemas
        run: >-
          uv run --no-project --python .venv312 python -m unittest
          backend.tests.test_parent_linking backend.tests.test_parity
          backend.tests.test_security_batch1 backend.tests.test_phase2
          backend.tests.test_batch1 backend.tests.test_eccd_phase2_lifecycle -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir frontend exec tsc --noEmit -p tsconfig.app.json
      - run: pnpm --dir frontend exec tsc --noEmit -p tsconfig.node.json
      - name: Type-check parent sync and teacher import browser coverage
        run: >-
          pnpm --dir frontend exec tsc --ignoreConfig --noEmit --target es2023
          --lib es2023,dom --module esnext --moduleResolution bundler
          --types node --skipLibCheck
          tests/parent-sync.spec.ts tests/teacher-import.spec.ts playwright.parent-sync.config.ts
      - run: pnpm --dir frontend run lint
      - run: pnpm --dir frontend run build
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Check parent links, import confirmation and durable reconnect behavior
        run: pnpm --dir frontend exec playwright test --config playwright.parent-sync.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: parent-sync-browser-results
          path: frontend/test-results/parent-sync/
