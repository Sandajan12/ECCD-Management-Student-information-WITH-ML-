packages:
  - frontend

# Retain the existing frontend lockfile and its exact dependency resolutions.
sharedWorkspaceLockfile: false

# Bootstrap explicitly; running both servers must not trigger competing installs.
verifyDepsBeforeRun: false

# Patch vulnerable transitive packages without upgrading their owning packages.
# Keep in sync with frontend/pnpm-workspace.yaml for frontend-root installs.
overrides:
  'follow-redirects@<1.16.1': 1.16.1
  'source-map-js@<1.2.2': 1.2.2
  'zod@>=4.0.0 <4.6.6': 4.6.6
